<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueRepo — iOS Tweaks</title>
    <style>
        :root {
            --bg: #0d1117;
            --card-bg: #161b22;
            --text: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #007aff;
            --accent-hover: #0056b3;
            --border: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .icon-box {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            background: linear-gradient(135deg, #007aff, #5856d6);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p.desc {
            color: var(--text-secondary);
            font-size: 15px;
            margin: 0 0 28px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px 20px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.15s ease, background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-sileo {
            background-color: var(--accent);
            color: #ffffff;
        }

        .btn-sileo:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #21262d;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background-color: #30363d;
        }

        .url-box {
            margin-top: 24px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, SF Pro Text, monospace;
            font-size: 13px;
            color: var(--text-secondary);
            word-break: break-all;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">⚡</div>
    <h1>BlueRepo</h1>
    <p class="desc">Персональный репозиторий твиков для iOS</p>

    <div class="btn-group">
        <a id="sileoBtn" href="#" class="btn btn-sileo">Добавить в Sileo</a>
        <a id="zebraBtn" href="#" class="btn btn-secondary">Добавить в Zebra</a>
        <button id="copyBtn" class="btn btn-secondary" onclick="copyRepoUrl()">Скопировать ссылку</button>
    </div>

    <div class="url-box" id="repoUrl">Loading...</div>
</div>

<script>
    const currentUrl = window.location.href;
    document.getElementById('repoUrl').innerText = currentUrl;

    // Генерация URL-схем для пакетных менеджеров
    document.getElementById('sileoBtn').href = "sileo://source/" + currentUrl;
    document.getElementById('zebraBtn').href = "zbra://sources/add/" + currentUrl;

    function copyRepoUrl() {
        navigator.clipboard.writeText(currentUrl).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "Скопировано!";
            setTimeout(() => {
                btn.innerText = "Скопировать ссылку";
            }, 2000);
        });
    }
</script>

</body>
</html>
